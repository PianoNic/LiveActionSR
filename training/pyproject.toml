[project]
name = "lasr-training"
version = "0.1.0"
description = "Training pipeline for tiny 2x luma super-resolution CNNs for live-action streaming video"
requires-python = ">=3.11"
license = "MIT"
# torch is installed separately (CPU wheel for CI/laptops, the CUDA build that ships with the
# RunPod PyTorch image on GPUs), see README.md.
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
export = ["onnx>=1.16", "onnxruntime>=1.18"]
logging = ["tensorboard>=2.16"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools]
packages = ["lasr"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["work", "runs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
ignore = [
    "B023",   # loop-variable capture in lambdas is intentional (default-arg bound)
    "SIM108", # ternaries are not always clearer
    "SIM115", # long-lived log file handles
    "SIM300", # range checks read naturally as 0 <= x
    "B905",   # zip(strict=) adds noise for same-length lists built right there
]

[tool.ruff.lint.isort]
known-first-party = ["lasr", "export", "evaluate", "train"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:torch.onnx.*",
    "ignore:.*legacy TorchScript-based ONNX export.*:DeprecationWarning",
    "ignore:Constant folding.*:UserWarning",
]
markers = [
    "ffmpeg: needs an ffmpeg binary with libx264/libx265/libsvtav1 (skipped when missing)",
]
