  # converts it to SDR BT.709 with the tone map that matched Netflix's own SDR trim of the same
  # frames at 34-36 dB PSNR-Y (DATASETS.md). 50 MB per frame, so this is the most expensive source
  # per clip (~300 MB per position); it is here for the scenes the seven SDR shots miss.
  # Frames 240-34500: no opening logo, no end credits (they start at ~580 s = frame ~34800).
  - id: netflix_meridian_hdr_tonemapped
    type: png_sequence
    url: "http://download.opencontent.netflix.com.s3.amazonaws.com/Meridian/tiffs/Meridian_UHD4k5994p_HDR_P3PQ_{n:05d}.tif"
    first: 240
    last: 34500
    tonemap: pq_p3d65
    split: train
    tier: permissive
    license: CC-BY-4.0 (Netflix Open Content)
    positions: 40
    crops_per_position: 4
    hr_scale: [0.4, 0.7]

