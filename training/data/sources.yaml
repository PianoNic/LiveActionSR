# Dataset sources. See ../DATASETS.md for the licence of each and why it is (or is not) enabled.
#
# Common keys:
#   id                  unique name (also the output folder)
#   type                png_sequence | y4m | video | raw_yuv | zip_sequence | image_dir
#   tonemap             pq_p3d65: the source is an HDR PQ / P3-D65 master; tone-map it to SDR BT.709
#   raw_yuv keys        width, height, pix_fmt (ffmpeg name), matrix (bt709), range (tv | pc),
#                       band_rows (fetch only that many rows of each sampled frame)
#   zip_sequence keys   url of the zip, patterns (member globs; sorted by name = frame order)
#   split               train | val      (val sources are held out entirely: no scene leaks)
#   tier                permissive | sharealike | research   (sharealike runs with --include-sharealike,
#                       research and sharealike with --include-research)
#   enabled             false = skipped unless named with --only
#   positions           how many places in the source to sample a short clip from
#   crops_per_position  deduplicated crops kept per sampled clip
#   hr_scale            [lo, hi] area-downscale of the source before cropping. 4K masters are taken
#                       down to ~1080-1500p (cleans source noise/compression, gives 1080p-like HR);
#                       1080p sources are only lightly reduced.
#
# Sizes: the default extraction (crop 512, clip_len 6) of the permissive set downloads roughly
# 100-115 GB (most of it 4K frames fetched with HTTP range requests; ~77 GB of that is for the
# sources added in November 2026) and writes up to ~6550 clips (~6350 train + ~180 val, i.e.
# positions x crops; the flat/duplicate filter drops some), ~40 GB of 16-bit PNG. Before November
# 2026 it was 25-35 GB and ~3000 clips. --scale-positions scales every source.

sources:
  # ---------------------------------------------------------------- permissive (default set)

  # Tears of Steel (Blender Foundation, 2012), CC-BY 3.0. Live action shot on a Sony F65 with VFX.
  # Lossless 1080p PNG master on Xiph. Opening logos and end credits are skipped.
  - id: tears_of_steel
    type: png_sequence
    url: "https://media.xiph.org/tearsofsteel/tearsofsteel-1080-png/graded_edit_final_{n:05d}.png"
    first: 300
    last: 12999
    split: train
    tier: permissive
    license: CC-BY-3.0 (Blender Foundation | mango.blender.org)
    positions: 700
    crops_per_position: 2
    hr_scale: [0.8, 1.0]
  - id: tears_of_steel_val
    type: png_sequence
    url: "https://media.xiph.org/tearsofsteel/tearsofsteel-1080-png/graded_edit_final_{n:05d}.png"
    first: 13000
    last: 14100
    split: val
    tier: permissive
    license: CC-BY-3.0 (Blender Foundation | mango.blender.org)
    positions: 40
    crops_per_position: 2
    hr_scale: [1.0, 1.0]

